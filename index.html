mps:{name:'MPS interlock latch-up',effect:'Beam permit chain interrupted',symptom:'Multiple concurrent MPS channel flags with no single obvious cause.',specialist:'Electrical engineer',game:'wires'}};

const PTOPICS=['Magnetic ordering in','Operando lithiation of','Residual stress mapping in','Hydrogen diffusion through','Glass transition dynamics of','Water transport across','Domain-wall motion in','Catalyst deactivation in','Protein solution structure of','Archaeometallurgy of'];

function makeProposal(){const boost=(S.rep-55)/450;const merit=clamp(Math.round(15+Math.random()*70+boost*100),5,100);const feas=25+Math.round(Math.random()*70);const days=20+Math.round(Math.random()*30);const comm=Object.entries(S.inst).filter(([k,x])=>x.commissioned);const inst=comm.length?pick(comm)[0]:'dream';const need=clamp(S.maxPower*(0.4+Math.random()*0.9),0.05,1.2);const reward=Math.round(merit*days/12);return{id:S.propId++,title:pick(PTOPICS).toLowerCase()+' '+pick(PSUBJ),req:pick(PREQ),merit,feas,days,inst,need,reward,opened:false,life:50,poolLife:110,autoT:5+Math.random()*5}}
function log(msg){let t=Math.floor(S.time),m=String(Math.floor(t/60)).padStart(2,'0'),s=String(t%60).padStart(2,'0');S.log.unshift(`${m}:${s} ${msg}`);S.log=S.log.slice(0,80)}function toast(x){let e=$('toast');e.textContent=x;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1700)}

function allReady(){let x=S.systems;return ['source','front','dtl','sc','rf','cryo','vac','hebt','target','moderator','mps','pss','ics'].every(k=>x[k].commissioned&&x[k].ready)&&!S.faults.length}function availability(){return S.scheduled?100*S.beamTime/S.scheduled:100}function updatePermit(){let old=S.permit;S.permit=allReady();if(old&&!S.permit){S.power=0;S.targetPower=0;S.mode='TRIPPED';log('MPS beam permit withdrawn · beam inhibited')}if(!old&&S.permit)log('Machine conditions satisfied · beam permit available')}

function ramp(){if(S.mode!=='BEAM'||!S.permit)return;let steps=[.005,.05,.2,.5,1,1.5,2],next=steps.find(x=>x>S.targetPower+.0001);if(!next||next>S.maxPower){toast('Current authorised power limit reached');return}S.targetPower=next;log(`Operator ramp request · ${fmtPower(next)}`)}

// ---------- Fault creation: masked cause ----------
function fault(){if(S.mode!=='BEAM'||Math.random()>.00005*(1+S.power)/(1+.3*S.improvements.maintenance))return;

log(`${d.name} · cause not yet identified`);triggerSlow();updatePermit();render()}
// ---------- Recovery mini game actions ----------
function diagnose(fid,k){const f=S.faults.find(x=>x.id===fid);if(!f||f.phase!=='identify')return;

else{f.mistakes++;S.scheduled+=10;log(`Misdiagnosis — ${S.systems[k].name} checked and cleared (lost time) `);toast('Wrong diagnosis · availability penalty');}
render()}
function dispatch(fid){const f=S.faults.find(x=>x.id===fid);if(!f||f.crew)return;if(S.crew<1){toast('No crew available — they regenerate over time');return}
S.crew--;f.crew=true;log(`${f.specialist} dispatched to ${S.systems[f.sys].name}`);render()}
function stepClick(fid,stepIdx){const f=S.faults.find(x=>x.id===fid);if(!f||f.game!=='sequencer'||!f.crew)return;
if(f.order[f.next]===stepIdx){f.next++;if(f.next>=f.steps.length)resolveFault(f)}

function stabNudge(fid,d){const f=S.faults.find(x=>x.id===fid);if(!f||f.game!=='stabilize'||!f.crew)return;f.v=clamp(f.v+d*2,-10,10)}
function wireToggle(fid,i){const f=S.faults.find(x=>x.id===fid);if(!f||f.game!=='wires'||!f.crew)return;
[i-1,i,i+1].forEach(x=>{if(x>=0&&x<5)f.wires[x]^=1});
if(f.wires.every(x=>x===0))resolveFault(f);else render()}
function resolveFault(f){S.faults=S.faults.filter(x=>x!==f);S.systems[f.sys].ready=true;
const dt=S.time-f.startedAt;const clean=f.mistakes===0;
let xp=8+Math.round(clamp(30-dt,0,20));if(clean){xp+=6;S.cleanRecovers++;log(`${S.systems[f.sys].name} restored after fault — clean response (+${xp} exp)`)}else log(`${S.systems[f.sys].name} restored after fault (+${xp} exp)`);
S.xp+=xp;updatePermit();restoreSpeed();toast('Subsystem recovered');advance();render()}
// ---------- Proposals ----------
function openProposal(id){const p=S.inbox.find(x=>x.id===id);if(!p||p.opened)return;p.opened=true;render()}
function decide(id,accept){const p=S.inbox.find(x=>x.id===id);if(!p)return;S.inbox=S.inbox.filter(x=>x.id!==id);
if(accept){S.pool.push(p);S.acceptedCount++;log(`Proposal accepted · ${p.title} (${S.inst[p.inst].name})`)}
else{log(`Proposal rejected · ${p.title}`);if(p.merit>=70){S.rep=clamp(S.rep-1,0,100);log('Reviewers query the rejection · reputation -1')}}
advance();render()}
function autoDecide(p){p.opened=true;if(p.merit>=S.threshold){S.pool.push(p);S.acceptedCount++;log(`Review panel auto-accepted · ${p.title}`)}else{log(`Review panel rejected · ${p.title}`)}advance()}
function callForProposals(){const cost=15;if(S.xp<cost){toast(`Need ${cost} experience`);return}S.xp-=cost;const n=2+Math.floor(Math.random()*2);
log(`Targeted proposal call announced · ${n} submission(s) requested`);

function selectPool(id){S.selPool=S.selPool===id?null:id;render()}

let reward=p.inst===k?p.reward:Math.round(p.reward*(INSTDEF[p.inst].mismatch||0.6));S.science+=reward*(1+.1*S.improvements.moderator);S.experiments++;S.xp+=18;S.rep=clamp(S.rep+1,0,100);log(`Experiment complete · ${p.title} on ${x.name} (+${Math.round(reward*(1+.1*S.improvements.moderator))} science)`);advance();render()}
// ---------- Instrument rapid-recovery mini game ----------
function repairClick(k){const x=S.inst[k];if(!x||x.down<=0||!x.repair)return;const r=x.repair;const off=Math.abs(r.pos-r.zone);
if(off<=6){x.down-=5;toast('✓ Bullseye · inspection advances 5 s')}
else if(off<=14){x.down-=2.5;toast('Good check · 2.5 s')}
else{x.down+=.5;toast('Missed · 0.5 s penalty')}
r.zone=15+Math.random()*70;r.dir=Math.random()<.5?-1:1;r.speed=55+Math.random()*25+S.campaign*5;

render()}
function finishRepair(k){const x=S.inst[k];x.ready=true;x.repair=null;log(`${x.name} rapid inspection complete · back in user operation`);S.xp+=4;advance()}
// ---------- Tick ----------
function tick(dt){S.time+=dt;updatePermit();let delivering=S.mode==='BEAM'&&S.permit;S.scheduled+=dt;
// crew regeneration
const maxCrew=3+S.improvements.crew;if(S.crew<maxCrew){S.crewTimer+=dt;if(S.crewTimer>=45){S.crewTimer=0;S.crew++;log('Shift crew rotation · staff token restored')}}else S.crewTimer=0;
// proposals
if(Object.values(S.inst).some(x=>x.commissioned)&&S.inbox.length<S.inboxCap+S.improvements.desk&&Math.random()<dt*0.07){const p=makeProposal();S.inbox.push(p);log('New proposal received · call open');render()}
for(const p of S.inbox){if(S.autoReview&&!p.opened){p.autoT-=dt;if(p.autoT<=0)autoDecide(p);continue}p.life-=dt}
const expired=S.inbox.filter(p=>!p.opened&&p.life<=0);if(expired.length){S.rep=clamp(S.rep-expired.length,0,100);log(`${expired.length} proposal(s) expired unreviewed · reputation -${expired.length}`)}S.inbox=S.inbox.filter(p=>!( !p.opened&&p.life<=0));
for(const p of S.pool){p.poolLife-=dt;if(p.poolLife<=0){S.rep=clamp(S.rep-2,0,100);log(`Accepted proposal never scheduled · ${p.title} (reputation -2)`)}}
S.pool=S.pool.filter(p=>p.poolLife>0);
// instruments
for(const k of Object.keys(S.inst)){const x=S.inst[k];if(x.down>0){x.down-=dt;if(x.repair){const r=x.repair;r.pos+=r.dir*r.speed*dt;if(r.pos>100){r.pos=100;r.dir=-1}if(r.pos<0){r.pos=0;r.dir=1}}if(x.down<=0){x.down=0;finishRepair(k)}continue}
if(!x.active&&x.queue.length){x.active={p:x.queue.shift(),left:0};x.active.left=x.active.p.days;log(`${x.name}: next experiment started · ${x.active.p.title}`);render()}}
// stabilization drift (runs even on other tabs — real-time pressure)
for(const f of S.faults){if(f.game!=='stabilize'||f.phase!=='repair'||!f.crew)continue;
f.v+=(Math.random()-.5)*3.2*dt*4;f.v=clamp(f.v,-10,10);
if(Math.abs(f.v)<3)f.progress+=dt*(7+2*S.improvements.recovery);else f.progress-=dt*2.5;
f.progress=clamp(f.progress,0,f.need);if(f.progress>=f.need)resolveFault(f)}
if(delivering){S.power+=(S.targetPower-S.power)*Math.min(1,dt*1.5);S.beamTime+=dt;
for(const k of Object.keys(S.inst)){const x=S.inst[k];if(x.active&&x.ready&&S.power>=x.active.p.need*.9){x.active.left-=dt*(1+.08*S.improvements.moderator);if(x.active.left<=0)completeExperiment(k)}}}
else S.power=Math.max(0,S.power-dt*.8);
fault();advance()}
function fmtPower(x){return x<.01?Math.round(x*1000)+' kW':x<1?Math.round(x*1000)+' kW':x.toFixed(x%1?1:0)+' MW'}

$('nbeamwrap').innerHTML=keys.map((k,i)=>{const yc=ys[i]+9.5;const on=S.mode==='BEAM'&&S.permit&&x.target.ready&&S.inst[k].commissioned;return `<path class="link n ${on?'on':''}" d="M405 37 C450 37 460 ${yc} 500 ${yc}"/>`}).join('');
$('instwrap').innerHTML=keys.map((k,i)=>{const s=S.inst[k];const cls='node '+(s.commissioned&&s.ready?'ready':(s.commissioned||s.down>0)?'fault':'');const dim=s.built?'':' style="opacity:.15"';return `<g class="${cls}"${dim}><rect x="500" y="${ys[i]}" width="68" height="19" rx="4"/><text class="lab" x="534" y="${ys[i]+12}">${s.name}</text></g>`}).join('');

function card(title,desc,meta='',right=''){return `<div class="card"><div class="cardrow"><div><div class="name">${title}</div><div class="desc">${desc}</div>${meta?`<div class="meta">${meta}</div>`:''}</div>${right}</div></div>`}
function bar(v,cls=''){return `<div class="sbar ${cls}"><i style="width:${clamp(v,0,100)}%"></i></div>`}
function crewDots(){const maxCrew=3+S.improvements.crew;let h='';for(let i=0;i<maxCrew;i++)h+=`<span class="${i<S.crew?'':'off'}">●</span>`;return `<span class="crewdots">${h}</span>`}
// ---------- Fault card rendering (the recovery mini game) ----------
function faultCard(f){const fi=f.id;let h=`<div class="card fault">`;
if(f.phase==='identify'){
h+=`<div class="name">⚠ ${f.name}</div><div class="desc">${f.symptom}</div><div class="meta">Beam permit affected · identify the failed subsystem</div>

else{
h+=`<div class="name">🔧 ${S.systems[f.sys].name} — ${f.name}</div><div class="desc">Cause identified. ${f.effect}.</div><div class="meta">Specialist: ${f.specialist}${f.mistakes?` · mistakes ${f.mistakes}`:''}</div>`;
if(!f.crew){h+=`<div class="actions"><button class="btn good" ${S.crew>=1?'':'disabled'} onclick="dispatch(${fi})">Dispatch ${f.specialist} (1 crew)</button>${S.crew<1?'<span class="tiny">crew regenerate over time</span>':''}</div>`}

f.order.forEach((stepIdx,pos)=>{const done=pos<f.next;const isNext=pos===f.next;h+=`<button class="stepbtn ${done?'done':''} ${isNext?'next':''}" ${done?'disabled':''} onclick="stepClick(${fi},${stepIdx})">${done?'✓ ':''}${f.steps[stepIdx]}</button>`});
h+='</div>';if(S.improvements.recovery>=2&&f.next<f.steps.length)h+=`<div class="tiny" style="margin-top:4px">Automated recovery: next correct step is highlighted green.</div>`}

<div class="stabzone"><div class="stabgreen"></div><div class="stabneedle" style="left:${pct}%"></div></div>
<div class="stat"><span>Stabilisation</span><b>${Math.round(100*f.progress/f.need)}%${inZone?'':' · OUT OF BAND'}</b></div>${bar(100*f.progress/f.need,inZone?'g':'r')}

h+='</div>'}}
h+='</div>';return h}

<div class="meta">${p.days}s on ${S.inst[p.inst].name} · needs ${fmtPower(p.need)} · reward ${p.reward} science · expires in ${Math.ceil(p.life)}s</div></div></div>
<div class="actions"><button class="btn good" onclick="decide(${p.id},true)">Accept → beamtime pool</button><button class="btn alt" onclick="decide(${p.id},false)">Reject</button></div></div>`}})}
function renderScience(c){c.innerHTML='<div class="section">BEAMTIME POOL · ACCEPTED PROPOSALS</div>';
if(!S.pool.length)c.innerHTML+=card('Pool empty','Accept proposals in the Proposals tab to schedule beamtime.','Unscheduled proposals expire and cost reputation');
S.pool.forEach(p=>{c.innerHTML+=`<div class="card" style="${S.selPool===p.id?'outline:1px solid var(--cyan)':''}"><div class="cardrow"><div><div class="name">${p.title}</div><div class="desc">${p.req}</div><div class="meta">${S.inst[p.inst].name} · ${p.days}s · needs ${fmtPower(p.need)} · ${p.reward} science${p.feas<50?' · ⚠ low feasibility':''}</div><div class="tiny">expires in ${Math.ceil(p.poolLife)}s</div></div><button class="btn ${S.selPool===p.id?'alt':''}" onclick="selectPool(${p.id})">${S.selPool===p.id?'Deselect':'Select'}</button></div></div>`});
c.innerHTML+='<div class="section">INSTRUMENT SCHEDULES</div>';
Object.entries(S.inst).forEach(([k,x])=>{if(!x.built){c.innerHTML+=card(`${x.name} · ${x.kind}`,x.desc,'Not yet built — see the Systems tab to expand the instrument suite');return}if(!x.commissioned){c.innerHTML+=card(x.name,x.kind,'Commission this instrument to schedule beamtime on it');return}
let right=x.down>0?`<span class="pill bad">DOWN ${Math.ceil(x.down)}s</span>`:`<button class="btn" ${S.selPool&&x.queue.length<3?'':'disabled'} onclick="assignInst('${k}')">Assign selected</button>`;
if(x.down>0){c.innerHTML+=repairCard(k);return}
let inner=`<div class="card"><div class="cardrow"><div><div class="name">${x.name} · ${x.kind}</div><div class="desc">${x.active?`Running: ${x.active.p.title}`:'Idle'}${x.queue.length?` · queue ${x.queue.length}/3`:''}</div>${x.active?`<div class="stat"><span>Progress</span><b>${Math.ceil(x.active.left)}s left</b></div>${bar(100*(1-x.active.left/x.active.p.days))}`:''}</div>${right}</div>`;
if(x.queue.length)inner+=`<div class="queue">${x.queue.map(q=>`<span class="chip">${q.title.slice(0,26)}… (${q.days}s)</span>`).join('')}</div>`;
inner+='</div>';c.innerHTML+=inner})}
function renderImprove(c){c.innerHTML=`<div class="section">PERFORMANCE DEVELOPMENT · EXPERIENCE ${S.xp}</div>`;let next=[.005,.05,.2,.5,1,1.5,2].find(x=>x>S.maxPower+.0001);if(next){let cost=Math.round(next*80+15);c.innerHTML+=card('Authorise higher beam power',`Complete tuning, validation and operational demonstration for ${fmtPower(next)}.`,`Cost ${cost} experience`,`<button class="btn" ${S.xp>=cost?'':'disabled'} onclick="authorise()">Authorise</button>`)}
let imp=[['tuning','Beam tuning campaign','Improves confidence in performance ramping'],['rf','RF conditioning','Reduces RF trip pressure'],['recovery','Automated recovery sequences','Faster fault recovery; at level 2 the correct procedure step is highlighted'],['target','Target reliability programme','Improves target operating margin'],['moderator','Moderator optimisation','Experiments complete faster and yield more science'],['maintenance','Condition-based maintenance','Reduces fault frequency'],['desk','Proposal desk capacity','+1 inbox slot for incoming proposals'],['crew','Shift crew roster','+1 crew token (max staffing for concurrent fault response)'],['panel','Peer review panel','Auto-reviews proposals above the merit threshold']];imp.forEach(([k,n,d])=>{if(k==='panel'&&S.autoReview)return;let cost=20+S.improvements[k]*20;c.innerHTML+=card(n,d,`Level ${S.improvements[k]} · cost ${cost} experience`,`<button class="btn alt" ${S.xp>=cost?'':'disabled'} onclick="upgrade('${k}',${cost})">Improve</button>`)});
if(S.autoReview)c.innerHTML+=`<div class="card"><div class="name">Review panel merit threshold</div><div class="desc">Proposals at or above this merit are auto-accepted; others are declined.</div><div class="meta">Threshold ${S.threshold}</div><input type="range" min="20" max="90" value="${S.threshold}" onchange="S.threshold=+this.value;render()"></div>`}
function upgrade(k,c){if(S.xp<c)return;S.xp-=c;if(k==='panel'){S.autoReview=1;log('Peer review panel established · auto-review active')}else{S.improvements[k]++;log(`${k} improvement programme completed · level ${S.improvements[k]}`)}render()}
function renderLog(c){c.innerHTML='<div class="section">MCR SHIFT LOG</div><div class="card log">'+(S.log.length?S.log.map((x,i)=>i===0?`<b>${x}</b>`:x).join('<br>'):'No events recorded yet.')+'</div>'}
function renderMain(){let b=$('mainBtn');if(!S.systems.source.commissioned){b.innerHTML='OPEN SYSTEMS<span class="sub">Begin commissioning the facility</span>';b.onclick=()=>setTab('systems');b.disabled=false;return}
if(S.faults.length){const f=S.faults[0];let sub=f.phase==='identify'?'Identify the failed subsystem to begin recovery':!f.crew?'Dispatch crew and execute the recovery procedure':'Resolve the active event';
b.innerHTML='RECOVERY IN PROGRESS<span class="sub">'+sub+'</span>';b.onclick=()=>setTab('operate');b.disabled=false;return}
if(!S.permit){b.innerHTML='ESTABLISH MACHINE READINESS<span class="sub">Commission all required systems</span>';b.onclick=()=>setTab('systems');b.disabled=false;return}
if(S.mode==='OFF'||S.mode==='TRIPPED'){b.innerHTML='START MACHINE<span class="sub">All required systems report ready</span>';b.onclick=startMachine;b.disabled=false;return}
if(S.mode==='READY'){b.innerHTML='REQUEST BEAM ON TARGET<span class="sub">MPS permit available · target ready</span>';b.onclick=beamOn;b.disabled=false;return}
const anyActive=Object.keys(S.inst).some(k=>S.inst[k].active);
if(!anyActive&&S.pool.length&&!S.inbox.length){b.innerHTML='SCHEDULE USER BEAMTIME<span class="sub">Assign accepted proposals to instruments</span>';b.onclick=()=>setTab('science');b.disabled=false;return}
if(!anyActive&&S.inbox.length){b.innerHTML='REVIEW INCOMING PROPOSALS<span class="sub">User programme awaits review decisions</span>';b.onclick=()=>setTab('propose');b.disabled=false;return}
b.innerHTML=`RAMP BEAM<span class="sub">Current ${fmtPower(S.power)} · authorised ${fmtPower(S.maxPower)}</span>`;b.onclick=ramp;b.disabled=false}
function setTab(x){tab=x;document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.tab===x));render()}document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>setTab(e.dataset.tab));
function modal(){let m=$('modal'),b=$('box');b.innerHTML='<h2>Welcome to ESS Operations</h2><p>You are coordinating an ESS operating campaign. Commission the integrated facility, obtain a beam permit, and deliver proton beam to the rotating tungsten target.</p><p><b>Failures are now hands-on.</b> When a fault strikes, you see symptoms — not the cause. Diagnose the failed subsystem, dispatch a specialist from your limited shift crew, then resolve it interactively: execute recovery procedures in order, keep RF detuning in band, or clear latched MPS interlock channels.</p><p>Meanwhile, run the scientific user programme: review proposals, assign beamtime, and climb toward the 2 MW design goal.</p><div class="actions"><button class="btn" id="go">Take the shift</button></div>';m.classList.add('show');$('go').onclick=()=>{m.classList.remove('show');log('Shift assumed · facility in commissioning configuration');render()}}
let last=performance.now();let uiAcc=0;let uiAcc2=0;let fid=1;
function loop(t){let dt=Math.min((t-last)/1000,.5);last=t;
const before=S.faults.length;tick(dt*S.speed);if(S.faults.length>before){S.faults[before].id=fid++}
uiAcc+=dt;if(uiAcc>0.4){uiAcc=0;$('power').textContent=fmtPower(S.power);$('avail').textContent=availability().toFixed(1)+'%';$('rep').textContent=Math.round(S.rep);$('powerbar').style.width=clamp(S.power/2*100,0,100)+'%';$('xp').textContent=S.xp;$('rep2').textContent=Math.round(S.rep);$('crew').innerHTML=crewDots();
const stabActive=S.faults.some(f=>f.game==='stabilize'&&f.crew);
const downActive=Object.keys(S.inst).some(k=>S.inst[k].down>0);
if(tab==='propose'||tab==='science')render();
if(downActive||stabActive){uiAcc2+=dt;if(uiAcc2>0.1){uiAcc2=0;if(tab==='operate'||tab==='science')render()}}
}
requestAnimationFrame(loop)}
render();modal();requestAnimationFrame(loop);
</script></body></html>
